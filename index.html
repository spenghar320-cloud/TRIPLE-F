<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triple F · Faiz Fast Food | Premium KFC Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #f4d47c;
      --gold-dark: #a8871f;
      --black: #0a0a0a;
      --dark: #121212;
      --dark-2: #1a1a1a;
      --dark-3: #222222;
      --white: #fafafa;
      --gray: #999999;
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      --shadow-gold: 0 10px 40px -10px rgba(212, 175, 55, 0.4);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--dark);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--gold), var(--gold-dark));
      border-radius: 10px;
    }

    /* ============ TOP BAR ============ */
    .top-bar {
      background: linear-gradient(90deg, #000 0%, #0a0a0a 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding: 12px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 12px;
      letter-spacing: 0.5px;
    }

    .top-bar-info {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .top-bar-info span {
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-bar-info i {
      color: var(--gold);
      font-size: 0.9rem;
    }

    .top-bar-info strong {
      color: var(--white);
      font-weight: 600;
    }

    .top-bar-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .top-bar-links a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-bar-links a:hover {
      color: var(--gold-light);
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    /* ============ HEADER ============ */
    .main-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      transition: all 0.3s ease;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-emblem {
      position: relative;
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border-radius: 50%;
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--black);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2), 0 8px 25px rgba(212, 175, 55, 0.3);
      transition: transform 0.3s ease;
    }

    .logo-emblem::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.3);
      animation: pulse-ring 3s ease-out infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .logo-area:hover .logo-emblem {
      transform: rotate(360deg) scale(1.05);
    }

    .logo-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .logo-text span {
      color: var(--gray);
      font-size: 0.7rem;
      letter-spacing: 4px;
      font-weight: 500;
      display: block;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      align-items: center;
    }

    .nav-links a:not(.order-btn) {
      position: relative;
      color: var(--white);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 0;
      transition: color 0.3s;
    }

    .nav-links a:not(.order-btn)::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transition: width 0.3s ease;
    }

    .nav-links a:not(.order-btn):hover {
      color: var(--gold);
    }

    .nav-links a:not(.order-btn):hover::after {
      width: 100%;
    }

    .order-btn {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--black) !important;
      padding: 13px 30px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      cursor: pointer;
    }

    .order-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5);
    }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      min-height: 88vh;
      display: flex;
      align-items: center;
      padding: 80px 6%;
      overflow: hidden;
      background: 
        radial-gradient(ellipse at top left, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
        linear-gradient(135deg, #0a0a0a 0%, #121212 100%);
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.08) 1px, transparent 1px);
      background-size: 60px 60px, 80px 80px;
      pointer-events: none;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .hero-text .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .badge i {
      color: var(--gold);
      animation: shine 2s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .hero-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 4.2rem;
      font-weight: 900;
      line-height: 1.05;
      color: var(--white);
      margin-bottom: 24px;
      letter-spacing: -1px;
    }

    .hero-text h2 .gold-text {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .hero-text p {
      font-size: 1.15rem;
      color: #b0b0b0;
      max-width: 520px;
      margin-bottom: 40px;
      line-height: 1.8;
      font-weight: 300;
    }

    .hero-actions {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--black);
      padding: 16px 36px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: var(--gold);
      padding: 16px 36px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--gold);
      transform: translateY(-3px);
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image-frame {
      position: relative;
      width: 100%;
      max-width: 520px;
      border-radius: 50%;
      overflow: hidden;
      aspect-ratio: 1;
      border: 3px solid rgba(212, 175, 55, 0.3);
      box-shadow: 
        0 0 0 15px rgba(212, 175, 55, 0.05),
        0 0 0 30px rgba(212, 175, 55, 0.03),
        0 30px 60px rgba(0, 0, 0, 0.7);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .hero-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .hero-image-frame:hover img {
      transform: scale(1.08);
    }

    .floating-badge {
      position: absolute;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 14px 22px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      animation: float 4s ease-in-out infinite;
    }

    .floating-badge.badge-1 {
      top: 8%;
      right: 0%;
      animation-delay: 0.5s;
    }

    .floating-badge.badge-2 {
      bottom: 12%;
      left: -2%;
      animation-delay: 1.5s;
    }

    .floating-badge i {
      font-size: 1.5rem;
      color: var(--gold);
    }

    .floating-badge .badge-text strong {
      display: block;
      font-size: 1rem;
      color: var(--white);
      font-weight: 700;
    }

    .floating-badge .badge-text span {
      font-size: 0.75rem;
      color: var(--gray);
      letter-spacing: 0.5px;
    }

    /* ============ MARQUEE STRIP ============ */
    .marquee-strip {
      background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      padding: 18px 0;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .marquee-track {
      display: inline-flex;
      animation: marquee 30s linear infinite;
    }

    .marquee-track span {
      color: var(--black);
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 0 40px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
    }

    .marquee-track i {
      font-size: 0.8rem;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ============ MENU SECTION ============ */
    .menu-section {
      padding: 100px 6% 80px;
      background: 
        radial-gradient(ellipse at top, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
        var(--black);
      position: relative;
    }

    .section-header {
      text-align: center;
      margin-bottom: 70px;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .section-label::before,
    .section-label::after {
      content: '';
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .section-label::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .section-header h2 .gold-text {
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .section-header p {
      color: var(--gray);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
      font-weight: 300;
    }

    .menu-filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gray);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--black);
      font-weight: 700;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .menu-card {
      background: linear-gradient(145deg, var(--dark-2) 0%, var(--dark) 100%);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-card:hover {
      transform: translateY(-12px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.1);
    }

    .menu-card:hover::before {
      opacity: 1;
    }

    .card-image {
      position: relative;
      height: 220px;
      overflow: hidden;
      background: #000;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .menu-card:hover .card-image img {
      transform: scale(1.1) rotate(1deg);
    }

    .card-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 10, 0.8) 0%, transparent 50%);
      pointer-events: none;
    }

    .card-tag {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--gold);
      color: var(--black);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 2;
    }

    .card-tag.hot {
      background: linear-gradient(135deg, #ff4500, #ff6b35);
      color: white;
    }

    .card-content {
      padding: 24px 22px 26px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-content h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-content .desc {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 20px;
      line-height: 1.6;
      flex: 1;
      font-weight: 300;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
    }

    .price-block {
      display: flex;
      flex-direction: column;
    }

    .price-block .currency {
      font-size: 0.7rem;
      color: var(--gray);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .price-block .amount {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
    }

    .add-btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1.5px solid var(--gold);
      color: var(--gold);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background: var(--gold);
      color: var(--black);
      transform: rotate(90deg) scale(1.1);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
    }

    /* ============ FEATURES STRIP ============ */
    .features-strip {
      padding: 70px 6%;
      background: var(--dark);
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }

    .features-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
    }

    .feature-item {
      text-align: center;
      padding: 20px;
    }

    .feature-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--gold);
      transition: all 0.3s ease;
    }

    .feature-item:hover .feature-icon {
      transform: translateY(-5px) rotate(10deg);
      background: var(--gold);
      color: var(--black);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }

    .feature-item h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 8px;
    }

    .feature-item p {
      font-size: 0.85rem;
      color: var(--gray);
      font-weight: 300;
    }

    /*
